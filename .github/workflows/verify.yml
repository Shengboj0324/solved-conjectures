name: verify conjecture results
on:
  push:
  pull_request:
concurrency:
  group: computational-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay the even-grid domination-game counterexample
        run: |
          python3 results/fiscus-grid-game/verify_strategy.py
          python3 results/fiscus-grid-game/check_minimax.py
      - name: Check the Erdős–Gyárfás point-degree spectrum inequality
        run: python3 results/erdos-gyarfas-point-degree-spectrum/verify.py
      - name: Count the incident lines in the Gyárfás planar construction
        run: python3 results/gyarfas-planar-degree-repetition/verify.py
      - name: Check all six Fuss–Narayana matrices
        run: python3 results/wang-yang-fuss-narayana/check.py
      - name: Check the permutation-pattern interval rank dip
        run: python3 results/mcnamara-steingrimsson-rank-unimodality/verify.py
      - name: Certify the two stable Waring-gap symmetry defects
        run: python3 results/benfield-lippard-waring-gap-symmetry/check.py
      - name: Check Burstein’s Ferrers-board mismatch on short suffixes
        run: python3 results/burstein-descent-top-shape-wilf/check.py
      - name: Certify the finite Rossi permutohedron sign grids
        run: python3 results/rossi-permutohedron-roots/check.py
      - name: Check power-monoid gadgets and the Burstein generating tree
        run: |
          python3 results/fan-tringali-power-monoid-lengths/check.py
          python3 results/burstein-a218225-enumeration/check.py
      - name: Replay leaf types, interior Ehrhart counts, and pinnacle paths
        run: |
          python3 results/chappelon-ramirez-stamate-leaf-type/check.py
          python3 results/ferroni-higashitani-early-interior-ehrhart/verify.py
          python3 results/gessel-zhuang-pinnacle-gamma/check-path.py
      - name: Check matching excess via literal graph witnesses
        run: python3 results/hartke-stolee-west-yancey-matching-excess/verify.py
      - name: Certify the plane-partition Fourier sign over exact rational boxes
        run: python3 results/heim-neuhauser-troeger-plane-partition-turan/heim-neuhauser-fourier-certificate.py
      - name: Certify all remaining plane-partition polynomial signs
        run: python3 results/heim-neuhauser-troeger-plane-partition-turan/heim-neuhauser-plane-partition-check.py
      - name: Certify the ordinary D’Arcais root conjecture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgmp-dev
          python3 results/heim-neuhauser-ordinary-darcais-root/heim-neuhauser-ordinary-fourier.py
          python3 results/heim-neuhauser-ordinary-darcais-root/heim-neuhauser-ordinary-small.py
          g++ -O3 -Wall -Wextra results/heim-neuhauser-ordinary-darcais-root/heim-neuhauser-ordinary-finite.cpp -lgmpxx -lgmp -o /tmp/ordinary-darcais-check
          /tmp/ordinary-darcais-check
      - name: Check Pantone–Bóna third-largest-terminal enumeration
        run: python3 results/pantone-bona-third-largest-terminal/verify.py
      - name: Check Pantone–Bóna second-smallest-terminal enumeration
        run: python3 results/pantone-bona-second-smallest-terminal/verify.py
      - name: Check Pantone–Bóna rank-marker gap counts
        run: python3 results/pantone-bona-second-largest-terminal/verify.py
      - name: Check Pantone–Bóna canonical front and tail counts
        run: python3 results/pantone-bona-asymptotic/verify.py
      - name: Check FCC/BCC hole distances and finite Gaussian samples
        run: python3 results/betermin-fcc-bcc-cold-spots/verify.py
      - name: Check the Coulangeon–Lazzarini lattice shells
        run: python3 results/coulangeon-lazzarini-two-shells/verify.py
      - name: Replay the exact parking-function excedance counterexample
        run: python3 results/alexandersson-parking-excedance/verify.py
      - name: Check Tom–Vailaya weighted trace on small graphs
        run: python3 results/tom-vailaya-weighted-trace/verify.py
      - name: Check threshold folded-tree alignment boundaries
        run: python3 results/steinke-zakynthinou-thresholds/verify.py --max-n 6
      - name: Replay finite-coin threshold learner
        run: python3 results/steinke-zakynthinou-thresholds/verify_efficiency.py
      - name: Replay deterministic threshold learner and priority estimates
        run: python3 results/steinke-zakynthinou-thresholds/verify_deterministic.py
      - name: Check Johnson Pfaffian identities and indexing
        run: python results/johnson-pfaffian/verify.py
      - name: Check Brown-Mol analytic counterfamily identities and finite certificate
        run: python results/brown-mol/check.py
      - name: Check Kovalev counterfamily constants
        run: |
          python results/kovalev-hardy-duality/verify.py
          python results/kovalev-hardy-duality/review_constants.py
      - name: Certify Roos-Seiringer positivity on the full compact interval
        run: python results/roos-seiringer-kernel/verify.py
      - name: Check Novelli–Thibon first moments and hook coefficients
        run: python results/novelli-thibon/verify.py
      - name: Check López Pouso–Segura Bessel-weight identities
        run: python results/lopez-pouso-segura-bessel/verify.py
      - name: Check Chen–Kitaev–Zhang record identities
        run: python results/chen-kitaev-zhang-records/verify.py
      - name: Check Zhu Jacobi–Stirling determinant identity
        run: python results/zhu-jacobi-stirling/verify.py
      - name: Check existing Baricz–Pogány formal-series identities
        run: python results/baricz-pogany-coefficients/verify.py
      - name: Check Malek transform scalar identities
        run: python results/malek-subpermanent/verify.py
      - name: Check permanental-compound trace and support identities
        run: python results/perron-root-permanental-compounds/verify.py
      - name: Check Wright disproof curvature identities
        run: python results/ferreira-simon-wright/verify.py
      - name: Check gamma-quotient signs, rank, and moment normalization
        run: python results/kvz-gamma-quotient/verify.py
      - name: Check Fuss–Catalan path conventions and exact formula
        run: python results/alexandersson-fuss-catalan/verify.py
      - name: Check Sagan–Swanson exact conditional probability models
        run: python results/sagan-swanson-normality/verify_model.py
      - name: Check Bernardi–Morales determinant and tree identities
        run: |
          python results/bernardi-morales-delta/verify.py
          python results/bernardi-morales-delta/verify_events.py
      - name: Check the Pantone–Bóna ODE and Gilmore and Chow polynomial conjectures
        run: |
          python -m pip install sympy==1.14.0
          python3 results/pantone-bona-asymptotic/certify_ode.py
          python3 results/chern-fu-lin-joint-eulerian/joint-certificate.py
          python results/gilmore-crossing-nesting/verify.py
          python results/chow-conjecture/verify.py
      - name: Replay dual Chow and symmetric edge polytope counterexamples
        run: |
          python3 results/caiolo-ferroni-hoster/verify_counterexample.py
          python3 results/caiolo-ferroni-hoster/verify_ranks.py
          python3 results/hkm-ehrhart/verify.py
      - name: Replay automorphic Li-coefficient interval certificate
        run: python3 results/chaudhary-khmiri-mazhouda/verify.py
      - name: Check extremal word pairs in Litt's game
        run: python results/ekhad-zeilberger-unfair-bet/verify.py
      - name: Check the Kauers–Koutschan recurrence
        run: python results/kauers-koutschan-recurrence/verify.py
      - name: Check Chen-Khare-Sahi exact semiring separation
        run: |
          python results/chen-khare-sahi-macdonald/verify.py
          python results/chen-khare-sahi-macdonald/independent_cone_check.py
          python results/chen-khare-sahi-macdonald/independent_orthogonality_check.py
      - name: Check Ferreira-Simon beta-prime symbolic identities
        run: python results/ferreira-simon-beta-prime/verify.py
      - name: Certify Lyon gamma-median monotonicity on all real cells
        run: python results/lyon-gamma-median/verify.py
      - name: Check Han-Sabag-Kostina-Hassibi exact Lyapunov counterexample
        run: python results/han-sabag-kostina-hassibi/verify.py
      - name: Check Vishnyakova polynomial-transform identities
        run: python results/vishnyakova-root-radius/verify.py
      - name: Check Franklin profile identities
        run: python results/mccrea-single-crossover/verify.py
      - name: Check Pula–Song–Wanless identities and parameter conventions
        run: python results/pula-song-wanless/verify.py
      - name: Verify partial results at Hadamard order 2396
        working-directory: results/hadamard-2396
        run: |
          python -m pip install numpy==2.2.6
          c++ -O2 -std=c++17 quotient133.cpp -o "$RUNNER_TEMP/hadamard133"
          "$RUNNER_TEMP/hadamard133" > "$RUNNER_TEMP/hadamard133.pairs"
          diff -u quotient133.pairs "$RUNNER_TEMP/hadamard133.pairs"
          python audit.py
          python border.py
          python automorphisms.py
      - name: Check the agnostic VC projection estimates
        run: python results/steinke-zakynthinou-agnostic-vc/verify.py
      - name: Verify partial results for Frankl, Lonely Runner and Erdős–Gyárfás
        run: |
          python -m pip install scipy==1.15.3
          python results/frankl-generator-families/span_four.py
          python results/frankl-generator-families/tree_messages.py
          python results/frankl-generator-families/message_audit.py
          python results/lonely-runner-two-insertions/two_additions.py
          python results/erdos-gyarfas-abelian-covers/verify.py
          python results/erdos-gyarfas-abelian-covers/sharpness.py
      - name: Check conditional lonely-runner examples
        run: python3 results/loneliness-on-a-hyperplane/verify.py
      - name: Check divisor-sum congruences and cofactor identities
        run: python3 results/erdos-granville-pomerance-spiro/verify.py
      - name: Check Horňák–Woźniak partition allocations
        run: python3 results/hornak-wozniak/verify.py
      - name: Check Sonntag–Teichert domination hypergraphs
        run: python3 results/sonntag-teichert/verify.py
      - name: Check finite prime-order circulant permanent examples
        run: python3 docs/nss/sanity_check.py --output "$RUNNER_TEMP/nss-sanity-results.json"
      - name: Verify L-solitaire exhaustive finite checks
        run: python3 results/l-solitaire-limit-shapes/verify.py
      - name: Verify Pham exact main and dual certificates
        run: |
          python3 results/pham-denominator-degree/verify.py
          python3 results/pham-denominator-degree/verify.py --dual --brute-depth 13
      - name: Run Pham regression tests
        run: cd results/pham-denominator-degree && python3 -m unittest discover -s tests -v
      - name: Verify Graffiti.pc 318 total-domination theorem
        run: python3 results/graffiti-pc-318/verify.py
      - name: Verify Li non-spider coefficient and partition certificates
        run: |
          python3 results/li-coefficient-sign/verify.py
          python3 results/li-coefficient-sign/independent_check.py
      - name: Verify Batista Egyptian-fraction congruence checks
        run: python3 results/batista-egyptian-fractions/verify.py
      - name: Verify the line-size generating function
        run: python3 results/erdos-607-line-sizes/verify.py
      - name: Verify rectangle packing and multiset recovery
        run: python3 results/rectangle-partition-asymptotics/verify.py
      - name: Replay standard three-player War deals
        run: python3 results/spivey-multiplayer-war/verify.py
      - name: Check the CUT Family B threshold against the game rules
        run: python3 results/cut-family-b/verify.py
      - name: Prove the two ultimate CUT periods by automata
        run: python3 results/cut-arithmetic-periodicity/verify.py
      - name: Reproduce the compact CUT Lean certificate tables
        run: |
          python3 results/cut-arithmetic-periodicity/generate_weight_certificates.py --output-dir "$RUNNER_TEMP/cut-weight"
          diff -u lean/Conjectures/CutPeriodWeightTables.lean "$RUNNER_TEMP/cut-weight/CutPeriodWeightTables.lean"
          diff -u lean/Conjectures/CutPeriodWeightCoverTables.lean "$RUNNER_TEMP/cut-weight/CutPeriodWeightCoverTables.lean"
      - name: Verify both distance-graph density results
        run: |
          c++ -std=c++20 -O3 results/distance-graph-densities/verify.cpp -o /tmp/verify-distance-graphs
          /tmp/verify-distance-graphs
          python3 results/distance-graph-densities/counterexample.py
      - name: Verify the Oravcová–Soták distance-graph classification
        run: python3 results/oravcova-sotak/verify.py
      - name: Check the Johnson–Kaya–Matzke path spectra
        run: python3 results/babai-spectrum-paths/verify.py
      - name: Check the two-difference Motzkin formula
        run: python3 results/two-difference-motzkin/verify.py
      - name: Check the symmetric four-point packing and covering theorem
        run: python3 results/symmetric-four-point-density/verify.py
      - name: Check the nonmixed-gap packing theorem
        run: python3 results/nonmixed-gap-packing/verify.py
      - name: Check Haralambis three-difference rotation certificates
        run: python3 results/haralambis-three-differences/verify.py
      - name: Check the upper-half circulant theorems and supplementary certificates
        run: |
          python3 results/circular-index-upper-half-circulants/verify.py
          python3 results/circular-index-upper-half-circulants/verify_part2.py
      - name: Check the upper-half graphs for maximum degree 2 mod 4
        run: python3 results/circular-index-upper-half-delta-2-mod-4/verify.py
      - name: Check the upper-half graphs for maximum degree 3 mod 4
        run: python3 results/circular-index-upper-half-delta-3-mod-4/verify.py
      - name: Check tomdif’s seven upper-half graph certificates
        run: python3 results/circular-index-upper-half-remaining-deltas/verify.py
      - name: Verify the five-speed loneliness spectrum
        run: python3 results/five-speed-spectrum/verify.py
      - name: Verify tight six-speed sets and seven-coordinate critical planes
        run: python3 results/tight-six-speeds/verify.py
      - name: Verify the six-speed loneliness spectrum
        run: python3 results/six-speed-spectrum/verify.py
      - name: Verify all equality cases for eight lonely runners
        run: python3 results/tight-seven-speeds/verify.py
      - name: Verify the unique equality case for nine lonely runners
        run: python3 results/tight-eight-speeds/verify.py
      - name: Verify the unique equality case for ten lonely runners
        run: python3 results/tight-nine-speeds/verify.py
      - name: Check Currie's conjecture on complexity 2n+1 and critical exponent
        run: python3 results/currie-conjecture-19/verify.py
      - name: Verify Zhang's lonely-runner deletion values
        run: python3 results/zhang-deletion-values/verify.py
      - name: Verify the forty shifted lonely-runner certificates
        run: |
          python3 results/shifted-lonely-runner-counterexamples/generate_lean.py --check
          python3 results/shifted-lonely-runner-counterexamples/verify.py --quick
      - name: Verify the seven-speed loneliness spectrum
        run: python3 results/seven-speed-spectrum/verify.py
      - name: Verify the eight-speed loneliness spectrum
        run: python3 results/eight-speed-spectrum/verify.py
      - name: Verify eleven- through fourteen-runner equality cases
        run: |
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/vzsky/13-lonely-runners/29311663c21835d67529b29a4acf6631fcad5c63/result_12 -o "$RUNNER_TEMP/first-lifts.log"
          python3 results/tight-eleven-to-fourteen/verify.py --legacy-log "$RUNNER_TEMP/first-lifts.log"
      - name: Check the Mazák–Zrubák lemmas for complete graphs minus an edge
        run: python3 results/circular-index-complete-minus-edge/verify.py
      - name: Check the colourings and perfect-sequencing searches for complete graphs minus a few edges
        run: |
          python3 results/circular-index-complete-minus-edges/verify.py
          python3 results/circular-index-complete-minus-edges/verify_seq.py
      - name: Check the wild-number conditions for complete graphs with n at least 155
        run: python3 results/wild-number-complete-graphs/verify.py
      - name: Check Cardon cubic and Rowland rank-sequence certificates
        run: |
          python3 results/cardon-zero-sector/verify.py
          python3 results/rowland-sistos-barron/verify.py --max-exponent 100
